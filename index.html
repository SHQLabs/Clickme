<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Dearest Kanchan 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffb3c6, #ffe5ec);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      animation: pop 0.8s ease;
      position: relative;
      z-index: 2;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 10px;
    }
.buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 40px;
  position: relative;
  margin-top: 30px;
}

#noBtn {
  position: relative;
}

    button {
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #yesBtn:hover {
      background: #e63950;
    }

    #noBtn {
      background: #adb5bd;
      color: white;
      position: absolute;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp linear forwards;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <div class="emoji">🐻💖</div>
    <h1>My dearest Kanchan,</h1>
    <p>will you be my Valentine?</p>
    
<div class="buttons">
  <button id="yesBtn" onclick="sayYes()">Yes</button>
  <button id="noBtn" onmouseover="moveNo()">No</button>
</div>

  <script>
    const noBtn = document.getElementById("noBtn");

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = Math.random() > 0.8 ? "🐥" : "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    function sayYes() {

      setInterval(createHeart, 300);

      // Open song safely
     window.open(
  "https://www.youtube.com/watch?v=VIT4kqQte00&autoplay=1",
  "_blank"
);


      document.body.innerHTML = `
        <div style="
          min-height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          background:linear-gradient(135deg,#ff758f,#ffb3c6);
          font-family:Arial;
          padding:20px;
          text-align:center;">

          <div style="
            background:white;
            padding:35px;
            border-radius:25px;
            max-width:420px;
            box-shadow:0 15px 40px rgba(0,0,0,0.3);">

            <h1>💘 She said YES 💘</h1>

            <p style="font-size:17px; line-height:1.6;">
              My dearest <b>Baby 🐥</b>,<br><br>
              You just made my heart melt completely.
              If love had a sound, it would be this moment 💕
            </p>

            <hr style="margin:20px 0;">

            <p style="font-size:16px; font-weight:bold;">
              This February month is special
            </p>

            <p style="font-size:15px; line-height:1.6;">
              4 Mondays<br>
              4 Tuesdays<br>
              4 Wednesdays<br>
              4 Thursdays<br>
              4 Fridays<br>
              4 Saturdays<br>
              4 Sundays

            </p>

            <p style="margin-top:15px; font-style:italic;">
              This only happens once every 823 years!
              AND IT BECAME EVEN MORE SPECIAL BECAUSE I GET TO LIVE in IT WITH YOUuu!!!!!!!!!!!

              Thank you for saying "YES" 🐥 I LOVE YOU MY VALENTINE. 
            </p>
          

            <p style="margin-top:20px;">
              🎶 10,000 Hours — because I’d spend every one of them with you 💖
            </p>

          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
