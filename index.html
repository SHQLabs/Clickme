<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Dearest Kanchan 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffb3c6, #ffe5ec);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      animation: pop 0.8s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      background: #adb5bd;
      color: white;
      position: absolute;
    }

    #yesBtn:hover {
      background: #e63950;
    }
  </style>
</head>

<body>

  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8f94f3d5f2.mp3?filename=romantic-piano-112191.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <div class="emoji">🐻💖</div>
    <h1>My dearest Kanchan,</h1>
    <p>will you be my Valentine?</p>

    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes</button>
      <button id="noBtn" onmouseover="moveNo()">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const music = document.getElementById("music");

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function sayYes() {
      music.play();

      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          text-align:center;
          background:linear-gradient(135deg,#ff758f,#ffb3c6);
          font-family:Arial;
          padding:20px;">
          <div style="
            background:white;
            padding:40px;
            border-radius:25px;
            box-shadow:0 15px 40px rgba(0,0,0,0.3);
            max-width:420px;">
            <h1>💘 She said YES 💘</h1>
            <p style="font-size:18px;">
              My dearest Kanchan,<br><br>
              You just made my heart smile in ways words can’t fully capture.
              From this moment, this Valentine’s Day becomes special —
              not because of roses or chocolates, but because of **you**.
              <br><br>
              Thank you for being my favorite thought, my calm, and my chaos 💕
            </p>
            <h2>😘🌹</h2>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
